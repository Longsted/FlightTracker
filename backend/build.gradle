plugins {
	id 'java'
	id 'org.springframework.boot' version '4.1.2'
	id 'io.spring.dependency-management' version '1.1.7'
	id 'jacoco'
	id 'checkstyle'
	id 'com.github.spotbugs' version '6.5.13'
	id 'com.diffplug.spotless' version '8.12.0'
}

group = 'dk.livetracker'
version = '0.0.1-SNAPSHOT'

java {
	toolchain {
		languageVersion = JavaLanguageVersion.of(21)
	}
}

repositories {
	mavenCentral()
}

dependencies {
	implementation 'org.springframework.boot:spring-boot-starter-webmvc'
	testImplementation 'org.springframework.boot:spring-boot-starter-webmvc-test'
	testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
	implementation 'org.springframework.boot:spring-boot-starter-restclient'
	implementation 'org.springframework.boot:spring-boot-starter-actuator'
}

tasks.named('test') {
	useJUnitPlatform()
}

tasks.register('bootRunE2E', org.springframework.boot.gradle.tasks.run.BootRun) {
	group = 'application'
	description = 'Runs the application with the E2E test provider.'

	dependsOn tasks.named('testClasses')
	classpath = sourceSets.test.runtimeClasspath
	mainClass = 'dk.livetracker.liveflighttracker.LiveFlightTrackerApplication'

	args '--spring.profiles.active=e2e'
}

tasks.named('spotbugsMain') {
	reports {
		html.required = true
	}
}
spotless{
	java{
		googleJavaFormat()
		removeUnusedImports()
	}
}
tasks.named('check'){
	dependsOn('spotlessCheck')
}
tasks.named('bootJar') {
	archiveFileName = 'app.jar'
}