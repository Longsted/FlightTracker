
name: CI

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

on:
  push:
  pull_request:
     branches:
      - main

jobs:

  workflow-lint:
    name: Lint workflow files
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Run actionlint
        uses: reviewdog/action-actionlint@v1

  backend:
    name: Build and test backend
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: backend

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Java 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle and cache
        uses: gradle/actions/setup-gradle@v6

      - name: Build, test, analyze and generate coverage report
        run: ./gradlew clean build spotbugsMain jacocoTestReport

      - name: Upload JaCoCo report
        uses: actions/upload-artifact@v7
        with:
          name: jacoco-report
          path: backend/build/reports/jacoco/test/html/

  frontend:
    name: Build, test and lint frontend
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node.js 22
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Check frontend formatting
        run: npm run format:check

      - name: Lint frontend
        run: npm run lint

      - name: Run frontend unit tests
        run: npm run test:unit

      - name: Run frontend integrationtests
        run: npm run test:e2e -- --project=integration

      - name: Build frontend
        run: npm run build

  e2e:
    name: Run E2E tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs:
      - backend
      - frontend

    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Java 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Set up Node.js 22
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Run E2E tests
        run: npm run test:e2e -- --project=e2e

  docker:
    name: Build Docker images
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs:
      - workflow-lint
      - backend
      - frontend
      - e2e

    permissions:
      contents: read
      packages: write

    steps:
      - name: check out repository
        uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build backend image
        uses: docker/build-push-action@v7
        with:
          context: ./backend
          push: false
          load: true
          tags: flighttracker-backend:${{ github.sha }}
          cache-from: type=gha,scope=backend
          cache-to: type=gha,scope=backend,mode=max

      - name: Build frontend image
        uses: docker/build-push-action@v7
        with:
          context: ./frontend
          push: false
          load: true
          tags: flighttracker-frontend:${{ github.sha }}
          cache-from: type=gha,scope=frontend
          cache-to: type=gha,scope=frontend,mode=max

      - name: Scan backend image with Trivy
        uses: aquasecurity/trivy-action@0.28.0
        with:
          image-ref: flighttracker-backend:${{ github.sha }}
          format: table
          exit-code: '0'
          ignore-unfixed: true
          severity: CRITICAL,HIGH

      - name: Scan frontend image with Trivy
        uses: aquasecurity/trivy-action@0.28.0
        with:
          image-ref: flighttracker-frontend:${{ github.sha }}
          format: table
          exit-code: '0'
          ignore-unfixed: true
          severity: CRITICAL,HIGH


      - name: Start containers
        run: IMAGE_TAG=${{ github.sha }} docker compose up -d --no-build

      - name: Check backend health
        run: |
          for _ in {1..30}; do
            if curl -fsS http://localhost:8080/actuator/health; then
              echo "Backend is healthy!"
              exit 0
            fi

            echo "Waiting for backend..."
            sleep 2
          done

          echo "Backend failed health check"
          docker compose logs backend
          exit 1
     

      - name: Check frontend health
        run: |
          for _ in {1..30}; do
            if curl -fsS http://localhost/health; then
              echo "Frontend is healthy!"
              exit 0
            fi

            echo "Waiting for frontend..."
            sleep 2
          done

          echo "Frontend failed health check"
          docker compose logs frontend
          exit 1

      - name: Stop containers
        if: always()
        run: docker compose down

      - name: Login to Github Container Registry
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Tag images for GHCR
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          IMAGE_PREFIX="ghcr.io/${GITHUB_REPOSITORY,,}"
          
          docker tag flighttracker-backend:${{ github.sha }} "$IMAGE_PREFIX/backend:${{ github.sha }}"
          docker tag flighttracker-frontend:${{ github.sha }} "$IMAGE_PREFIX/frontend:${{ github.sha }}"

      - name: Push images to GHCR
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          IMAGE_PREFIX="ghcr.io/${GITHUB_REPOSITORY,,}"

          docker push "$IMAGE_PREFIX/backend:${{ github.sha }}"
          docker push "$IMAGE_PREFIX/frontend:${{ github.sha }}"

  cleanup-ghcr:
    name: Clean up old GHCR images
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs:
      - docker
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    permissions:
      packages: write

    steps:
      - name: Delete old backend image versions
        uses: actions/delete-package-versions@v5
        with:
          package-name: ${{ github.event.repository.name }}/backend
          package-type: container
          min-versions-to-keep: 5

      - name: Delete old frontend image versions
        uses: actions/delete-package-versions@v5
        with:
          package-name: ${{ github.event.repository.name }}/frontend
          package-type: container
          min-versions-to-keep: 5

