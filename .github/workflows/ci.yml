
name: CI

permissions:
  contents: read

on:
  push:
  pull_request:
    branches:
      - main

jobs:
  build-and-test:
    name: Build and test backend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Java 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Build, test, analyze and generate coverage report
        run: ./gradlew clean build spotbugsMain jacocoTestReport

      - name: Upload JaCoCo report
        uses: actions/upload-artifact@v7
        with:
          name: jacoco-report
          path: backend/build/reports/jacoco/test/html/

  frontend:
    name: Build, test and lint frontend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node.js 22
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install chromium

      - name: Check frontend formatting
        run: npm run format:check

      - name: Lint frontend
        run: npm run lint

      - name: Run frontend unit tests
        run: npm run test:unit

      - name: Run frontend integration and E2E tests
        run: npm run test:e2e

      - name: Build frontend
        run: npm run build

  docker:
    name: Build Docker images
    runs-on: ubuntu-latest
    needs:
      - build-and-test
      - frontend

    permissions:
      contents: read
      packages: write

    steps:
      - name: check out repository
        uses: actions/checkout@v7

      - name: build backend image
        run: docker build -t flighttracker-backend:${{ github.sha }} ./backend

      - name: build frontend image
        run: docker build -t flighttracker-frontend:${{ github.sha }} ./frontend

      - name: start backend container
        run: docker run -d -p 8080:8080 flghttracker-backend:${{ github.sha }}

      - name: Start backend container
        run: docker run -d -p 8080:8080 flighttracker-backen:${{ github.sha }}

      - name: Check backend health
        run:  |
          for i in {1..30}; do
            if curl -fsS https://localhost:8080/actuator/health; then
            echo "Backend is healthy!"
            exit 0
          fi
        
          echo "waiting for backend..."
          sleep 2
         done
        
         echo "backend failed health check"
         exit 1

      - name: Login to Github Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}