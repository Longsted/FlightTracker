
name: CI

permissions:
  contents: read

on:
  push:
  pull_request:
    branches:
      - main

jobs:

  workflow-lint:
    name: Lint workflow files
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Run actionlint
        uses: reviewdog/action-actionlint@v1

  build-and-test:
    name: Build and test backend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Java 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Build, test, analyze and generate coverage report
        run: ./gradlew clean build spotbugsMain jacocoTestReport

      - name: Upload JaCoCo report
        uses: actions/upload-artifact@v7
        with:
          name: jacoco-report
          path: backend/build/reports/jacoco/test/html/

  frontend:
    name: Build, test and lint frontend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node.js 22
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install chromium

      - name: Check frontend formatting
        run: npm run format:check

      - name: Lint frontend
        run: npm run lint

      - name: Run frontend unit tests
        run: npm run test:unit

      - name: Run frontend integration and E2E tests
        run: npm run test:e2e

      - name: Build frontend
        run: npm run build

  docker:
    name: Build Docker images
    runs-on: ubuntu-latest
    needs:
      - workflow-lint
      - build-and-test
      - frontend

    permissions:
      contents: read
      packages: write

    steps:
      - name: check out repository
        uses: actions/checkout@v7

      - name: build backend image
        run: docker build -t flighttracker-backend:${{ github.sha }} ./backend

      - name: build frontend image
        run: docker build -t flighttracker-frontend:${{ github.sha }} ./frontend

      - name: Start containers
        run: IMAGE_TAG=${{ github.sha }} docker compose up -d --no-build

      - name: Check backend health
        run: |
          for i in {1..30}; do
            if curl -fsS http://localhost:8080/actuator/health; then
              echo "Backend is healthy!"
              exit 0
            fi

            echo "Waiting for backend..."
            sleep 2
          done

          echo "Backend failed health check"
          docker compose logs backend
          exit 1
     

      - name: Check frontend health
        run: |
          for i in {1..30}; do
            if curl -fsS http://localhost/health; then
              echo "Frontend is healthy!"
              exit 0
            fi

            echo "Waiting for frontend..."
            sleep 2
          done

          echo "Frontend failed health check"
          docker compose logs frontend
          exit 1

      - name: Stop containers
        if: always()
        run: docker compose down

      - name: Login to Github Container Registry
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Tag images for GHCR
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          IMAGE_PREFIX=ghcr.io/${GITHUB_REPOSITORY,,}
          
          docker tag flighttracker-backend:${{ github.sha }} $IMAGE_PREFIX/backend:${{ github.sha }}
          docker tag flighttracker-frontend:${{ github.sha }} $IMAGE_PREFIX/frontend:${{ github.sha }}

      - name: Push images to GHCR
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          IMAGE_PREFIX=ghcr.io/${GITHUB_REPOSITORY,,}

          docker push $IMAGE_PREFIX/backend:${{ github.sha }}
          docker push $IMAGE_PREFIX/frontend:${{ github.sha }}

