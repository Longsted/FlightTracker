name: flight-tracker

services:
  backend:
      build: ./backend
      environment:
        OPENSKY_CLIENT_ID: ${OPENSKY_CLIENT_ID}
        OPENSKY_CLIENT_SECRET: ${OPENSKY_CLIENT_SECRET}
      restart: unless-stopped
      expose:
        - "8080"

      healthcheck:
        test: ["CMD", "curl", "-f", "http://localhost:8080/actuator/health"]
        interval: 30s
        timeout: 10s
        retries: 3
        start_period: 40s


  frontend:
    build: ./frontend
    restart: unless-stopped
    ports:
      - "80:80"

    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost/health" ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s


